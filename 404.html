<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Stránka neexistuje | BOOOM</title>
  <link rel="icon" type="image/png" href="/icon-512.png">
  <style>
    :root { --green: #00e676; --cyan: #00d4ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0a; color: #fff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; text-align: center; padding: 24px; }
    .logo { font-size: 28px; font-weight: 900; letter-spacing: 4px; background: linear-gradient(135deg, var(--green), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 900; letter-spacing: -1px; margin: 28px 0 10px; }
    p { color: rgba(255,255,255,0.55); font-size: 16px; line-height: 1.6; margin: 0 0 28px; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn { display: inline-block; padding: 14px 26px; border-radius: 12px; font-weight: 800; text-decoration: none; color: #000; background: linear-gradient(135deg, var(--green), var(--cyan)); }
    a.ghost { color: #fff; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); }
  </style>
</head>
<body>
  <main>
    <div class="logo">BOOOM</div>
    <h1>Táto stránka neexistuje</h1>
    <p>Chyba 404. Adresa je zlá alebo stránku sme presunuli.<br>This page does not exist.</p>
    <div class="row">
      <a class="btn" href="/">Na hlavnú stránku</a>
      <a class="btn ghost" href="https://app.booom.fit">Otvoriť appku</a>
    </div>
  </main>
</body>
</html>
