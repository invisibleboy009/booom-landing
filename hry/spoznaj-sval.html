var todayKey = dayKey(new Date());
var seed = seedFromString(todayKey + "-sval");
var todaysQuestions = seededShuffle(POOL, seed).slice(0, 12);

var LS_STREAK = "booom_sval_streak";
var LS_LASTDAY = "booom_sval_lastday";
var LS_BEST = "booom_sval_best";

function readStreak(){ try { var last=localStorage.getItem(LS_LASTDAY); var s=parseInt(localStorage.getItem(LS_STREAK)||"0",10); return last? s:0; } catch(e){ return 0; } }
function bumpStreak(){
  try {
    var last = localStorage.getItem(LS_LASTDAY);
    var streak = parseInt(localStorage.getItem(LS_STREAK)||"0",10);
    if (last === todayKey) return streak || 1;
    var lastD = last ? new Date(last+"T00:00:00") : null;
    var today = new Date(todayKey+"T00:00:00");
    var diffDays = lastD ? Math.round((today-lastD)/86400000) : null;
    var next = (diffDays===1) ? streak+1 : 1;
    localStorage.setItem(LS_STREAK, String(next));
    localStorage.setItem(LS_LASTDAY, todayKey);
    return next;
  } catch(e){ return 1; }
}
function readBest(){ try { return parseInt(localStorage.getItem(LS_BEST)||"0",10); } catch(e){ return 0; } }
function writeBest(v){ try { localStorage.setItem(LS_BEST, String(v)); } catch(e){} }

document.getElementById("liveTotal").textContent = String(todaysQuestions.length);
document.getElementById("bestDisplay").textContent = String(readBest());
document.getElementById("streakDisplay").textContent = String(readStreak());

var idx = 0;
var score = 0;
var results = [];

var screenIntro = document.getElementById("screenIntro");
var screenQuiz = document.getElementById("screenQuiz");
var screenResult = document.getElementById("screenResult");
var progressRow = document.getElementById("progressRow");
var marker = document.getElementById("marker");
var figureImg = document.getElementById("figureImg");
var answerGrid = document.getElementById("answerGrid");
var revealCard = document.getElementById("revealCard");
var revealTag = document.getElementById("revealTag");
var revealAnswer = document.getElementById("revealAnswer");
var revealFact = document.getElementById("revealFact");
var liveScoreEl = document.getElementById("liveScore");

function buildProgress(){
  progressRow.innerHTML = "";
  for (var i=0;i<todaysQuestions.length;i++){
    var cls = "dot";
    if (i < results.length) cls += results[i] ? " correct" : " wrong";
    else if (i === idx) cls += " now";
    var d = document.createElement("div"); d.className = cls;
    progressRow.appendChild(d);
  }
}

function shuffleOpts(opts, seed){
  return seededShuffle(opts, seed);
}

function renderQuestion(){
  buildProgress();
  liveScoreEl.textContent = String(score);
  if (idx >= todaysQuestions.length){ finish(); return; }
  var q = todaysQuestions[idx];
  figureImg.src = (q.view === "back") ? IMG_BACK : IMG_FRONT;
  marker.style.left = q.left + "%";
  marker.style.top = q.top + "%";
  var opts = shuffleOpts(q.opts, seed + idx*7 + 3);
  answerGrid.innerHTML = "";
  answerGrid.style.display = "grid";
  revealCard.classList.remove("show", "correct", "wrong");
  opts.forEach(function(opt){
    var btn = document.createElement("button");
    btn.className = "aBtn";
    btn.textContent = opt;
    btn.addEventListener("click", function(){ answer(opt, q); });
    answerGrid.appendChild(btn);
  });
}

function answer(said, q){
  var correct = (said === q.name);
  results.push(correct);
  if (correct) score++;
  answerGrid.style.display = "none";
  revealCard.classList.add("show", correct ? "correct" : "wrong");
  revealTag.textContent = correct ? "SPRÁVNE" : "NESPRÁVNE";
  revealTag.className = "revealTag " + (correct ? "correct" : "wrong");
  revealAnswer.textContent = q.name;
  revealFact.textContent = q.fact + " Cviky: " + q.exercises.join(", ") + ".";
}

document.getElementById("nextBtn").addEventListener("click", function(){
  idx++;
  renderQuestion();
});

document.getElementById("startBtn").addEventListener("click", function(){
  screenIntro.style.display = "none";
  screenQuiz.style.display = "block";
  idx = 0; score = 0; results = [];
  renderQuestion();
});

function getTier(sc){
  var t = TIERS[0];
  for (var i=0;i<TIERS.length;i++){ if (sc >= TIERS[i].min) t = TIERS[i]; }
  return t;
}

function finish(){
  screenQuiz.style.display = "none";
  var tier = getTier(score);
  var streakVal = bumpStreak();
  var best = readBest();
  if (score > best) { writeBest(score); best = score; }

  document.getElementById("tierBadge").textContent = tier.badge;
  document.getElementById("tierBadge").style.background = tier.color;
  document.getElementById("tierName").textContent = tier.name;
  document.getElementById("tierName").style.color = tier.color;
  document.getElementById("tierScoreNum").textContent = score + "/" + todaysQuestions.length;
  document.getElementById("tierDesc").textContent = tier.desc;
  document.getElementById("streakAfter").textContent = String(streakVal);

  drawShareCard(tier, score, todaysQuestions.length, streakVal);
  screenResult.classList.add("show");
}

function drawShareCard(tier, sc, total, streakVal){
  var canvas = document.getElementById("shareCanvas");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;
  var grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#0d0d0d"); grad.addColorStop(1,"#050505");
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 2; ctx.strokeRect(30,30,W-60,H-60);

  ctx.fillStyle = "#00e676"; ctx.font = "900 46px Inter, Arial, sans-serif"; ctx.textAlign = "left";
  ctx.fillText("BOOOM", 70, 130);
  ctx.fillStyle = "#666"; ctx.font = "700 24px Inter, Arial, sans-serif";
  ctx.fillText("SPOZNAJ SVAL!", 70, 168);

  roundRect(ctx, W/2-190, 220, 380, 60, 30);
  ctx.fillStyle = tier.color; ctx.fill();
  ctx.fillStyle = "#0a0a0a"; ctx.textAlign = "center"; ctx.font = "900 22px Inter, Arial, sans-serif";
  ctx.fillText(tier.badge, W/2, 258);

  ctx.fillStyle = "#fff"; ctx.font = "900 52px Inter, Arial, sans-serif";
  wrapText(ctx, tier.name, W/2, 390, W-140, 62);

  ctx.fillStyle = tier.color; ctx.font = "900 150px Inter, Arial, sans-serif";
  ctx.fillText(sc + "/" + total, W/2, 660);
  ctx.fillStyle = "#888"; ctx.font = "700 26px Inter, Arial, sans-serif";
  ctx.fillText("SPRÁVNYCH SVALOV", W/2, 700);

  ctx.fillStyle = "#ccc"; ctx.font = "500 30px Inter, Arial, sans-serif";
  wrapText(ctx, tier.desc, W/2, 800, W-160, 42);

  ctx.fillStyle = "#f97316"; ctx.font = "800 28px Inter, Arial, sans-serif";
  ctx.fillText("🔥 " + streakVal + " " + (streakVal===1?"deň":"dni") + " v sérii", W/2, 1120);

  ctx.fillStyle = "#555"; ctx.font = "700 24px Inter, Arial, sans-serif";
  ctx.fillText("Zahraj si na booom.fit/hry/spoznaj-sval", W/2, 1230);
  ctx.fillStyle = "#00d4ff"; ctx.font = "900 30px Inter, Arial, sans-serif";
  ctx.fillText("booom.fit", W/2, 1275);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){
  var words=text.split(" "),line="",lines=[];
  for (var n=0;n<words.length;n++){
    var t=line+words[n]+" ";
    if (ctx.measureText(t).width>maxWidth && n>0){ lines.push(line); line=words[n]+" "; } else line=t;
  }
  lines.push(line);
  var startY=y-((lines.length-1)*lineHeight)/2;
  for (var i=0;i<lines.length;i++) ctx.fillText(lines[i].trim(), x, startY+i*lineHeight);
}

document.getElementById("btnDownload").addEventListener("click", function(){
  var canvas = document.getElementById("shareCanvas");
  canvas.toBlob(function(blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "booom-spoznaj-sval.png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }, "image/png");
});

document.getElementById("btnRetry").addEventListener("click", function(){
  var s = seedFromString(todayKey + "-sval-" + Date.now());
  todaysQuestions = seededShuffle(POOL, s).slice(0, 12);
  screenResult.classList.remove("show");
  screenQuiz.style.display = "block";
  idx = 0; score = 0; results = [];
  renderQuestion();
});

})();
</script>
</body>
</html>
